schemaVersion: "1.0"
version: "1.0"
name: plan-executor
description: Behavioral evaluation suite for plan-executor admission and freshness gates
skill: plan-executor

config:
  trials_per_task: 1
  timeout_seconds: 120
  parallel: false
  executor: copilot-sdk
  model: auto
  disabled_skills:
    - executable-planning
    - plan-checker
    - hone-the-plan
    - plan-it-out
    - remember-that
    - skill-forge
    - teach-by-doing

metrics:
  - name: task_completion
    weight: 1.0
    threshold: 0.8
    description: Execution stops before implementation when plan admission is not established

tasks:
  - "tasks/*.yaml"
