# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json

id: 13-session-only-handoff
name: Continue an approved interactive session-only handoff
description: "Verify session-only storage composes with interactive phase elaboration"
tags:
  - R04-clarify-interaction-mode
  - R05-clarify-storage-choice
  - R43-elaboration-explicit-or-preexecution-trigger
  - R44-elaboration-scoped-clarify
  - R45-elaboration-review-checkpoint
inputs:
  prompt: "The outline is approved for this interactive session-only handoff: Phase 1 updates the config parser; Phase 2 migrates callers. Continue building the complete plan here, starting with Phase 1. This is a behavior-only evaluation with no repository context: do not call tools or inspect files. Infer conservative Phase 1 steps and stop at its confirmation checkpoint; do not elaborate Phase 2 yet."
expected:
  output_not_contains:
    - "choose a storage"
    - "interactive or autopilot"
graders:
  - name: behavior-judge
    type: prompt
    config:
      continue_session: true
      prompt: |
        Evaluate whether the agent's response satisfies the following criteria:
        - [R04-clarify-interaction-mode] Preserves interactive mode.
        - [R05-clarify-storage-choice] Preserves session-only storage without asking again.
        - [R43-elaboration-explicit-or-preexecution-trigger] Elaborates phases in order after outline confirmation.
        - [R44-elaboration-scoped-clarify] Asks only the active phase's unresolved questions.
        - [R45-elaboration-review-checkpoint] Confirms each phase's steps before moving to the next.
          - FORBIDDEN: Must not ask the user to choose mode or storage again.
          If every criterion is met, call set_waza_grade_pass. Otherwise, call set_waza_grade_fail with the unmet criteria.
