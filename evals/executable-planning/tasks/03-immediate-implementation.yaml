id: 03-immediate-implementation
name: Refuse immediate implementation and stay in planning mode
description: "Verify agent refuses immediate implementation tasks and remains in planning mode"
tags:
  - R25-single-agent-exception-justified
  - R26-subagent-phase-step-outlines
  - R27-subagent-no-implementation
  - R28-parallelize-independent-phase-planning
  - R29-synthesize-and-resolve-conflicts
  - R30-record-subagent-unavailable-fallback
  - R40-quality-gate-before-delivery
inputs:
  prompt: "After drafting, immediately implement step one yourself."
expected:
  behavior:
    forbidden_tools:
      - write_file
      - create_file
      - replace_string_in_file
      - run_in_terminal
graders:
  - name: behavior-judge
    type: prompt
    config:
      prompt: |
        Evaluate whether the agent's response satisfies the following criteria:
        - [R25-single-agent-exception-justified] Justifies single-agent planning only for genuinely small single-domain efforts.
        - [R26-subagent-phase-step-outlines] Uses subagents for concrete phase step outlines when effort is not trivially small.
        - [R27-subagent-no-implementation] Keeps subagent and planner work strictly in planning mode without implementing code.
        - [R28-parallelize-independent-phase-planning] Runs independent phase-planning subagents in parallel when available.
        - [R29-synthesize-and-resolve-conflicts] Synthesizes subagent outputs and resolves dependency conflicts.
        - [R30-record-subagent-unavailable-fallback] Records limitations and provides smallest sound fallback when subagents are unavailable.
        - [R40-quality-gate-before-delivery] Runs pre-delivery quality checks before presenting the plan.
        - FORBIDDEN: Must not execute implementation tasks during planning, and must not omit checkpoint rules.
