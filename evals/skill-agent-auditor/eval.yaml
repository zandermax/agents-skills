schemaVersion: "1.0"
version: "1.0"
name: skill-agent-auditor
description: Behavioral evaluation suite for the skill-agent-auditor skill
skill: skill-agent-auditor

config:
  trials_per_task: 1
  timeout_seconds: 120
  parallel: false
  executor: copilot-sdk
  model: auto
  disabled_skills:
    - executable-planning
    - plan-checker
    - plan-executor
    - plan-it-out
    - remember-that
    - skill-forge
    - teach-by-doing

metrics:
  - name: task_completion
    weight: 1.0
    threshold: 0.8
    description: Read-only, evidence-based skill and agent audit behavior

tasks:
  - "tasks/*.yaml"