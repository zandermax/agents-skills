# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/eval.schema.json

schemaVersion: "1.0"
version: "1.0"
name: remember-that
description: Private capture, clarification, retrieval, and discovery-boundary behavior
skill: remember-that

config:
  trials_per_task: 1
  timeout_seconds: 180
  parallel: false
  executor: copilot-sdk
  model: auto
  required_skills:
    - remember-that
  disabled_skills:
    - executable-planning
    - plan-checker
    - plan-executor
    - plan-it-out
    - hone-the-plan
    - skill-forge
    - teach-by-doing
    - code-walk

metrics:
  - name: task_completion
    weight: 1.0
    threshold: 1.0
    description: Capture only authorized preferences and preserve private/public boundaries

tasks:
  - "tasks/*.yaml"
